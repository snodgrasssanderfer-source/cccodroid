<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小克 · 平板</title>
<link rel="stylesheet" href="pad.css">
</head>
<body>
<!-- 没配对 / 在找手机 / 比对 6 位数 -->
<section id="setup" hidden>
  <img id="setup-art" src="art/pad/pair.webp" alt="">
  <h1 id="setup-title"></h1>
  <p id="setup-text"></p>
  <div id="sas" hidden></div>
  <p id="setup-err" class="err" hidden></p>
  <p id="diag" class="diag"></p>
  <button id="pair" class="btn" hidden>配对</button>
  <details id="manual"><summary>自动找不到？手动填手机的地址</summary>
    <p>手机上「我的 → 平板」里写着，像 192.168.1.23:8797。</p>
    <form id="manual-f"><input id="manual-a" placeholder="192.168.1.23:8797" inputmode="url"><button class="btn small">连这个</button></form>
  </details>
</section>
<!-- 连上了：群聊 -->
<section id="chat" hidden>
  <header>
    <img src="art/room/room_avatar.webp" alt="">
    <div><b>我们仨</b><small id="phone"></small></div>
    <button id="vbtn" class="btn small ghost">声音</button>
    <button id="screen" class="btn small">看手机画面</button>
  </header>
  <div id="voice" hidden>
    <p id="vstate"></p>
    <form id="vcode-f"><input id="vcode" placeholder="电脑上显示的配对码" autocomplete="off" autocapitalize="characters"><button class="btn small">保存</button></form>
    <label><input type="checkbox" id="von"> 她们的话念出来</label>
    <button id="vfind" class="btn small ghost">重新找电脑</button>
  </div>
  <button id="upd" hidden></button>
  <div id="mem"></div>
  <div id="list"><div id="empty"><img src="art/room/room_empty.webp" alt=""><p>三个人都在，等你开口。点上面的头像可以只叫她接话。</p></div></div>
  <div id="typing"></div>
  <div id="listening" hidden><div id="lart"></div><p>在听…松手发送</p></div>
  <form id="in"><button type="button" id="mic" class="btn ghost" hidden>按住说话</button><textarea rows="1" placeholder="在群里说点什么…"></textarea><button class="btn" aria-label="发送">发送</button></form>
  <p id="stream-err" class="err" hidden></p>
</section>
<script src="pad.js"></script>
</body>
</html>
