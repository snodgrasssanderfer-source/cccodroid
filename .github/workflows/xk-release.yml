# 小克的正式包：开发分支（claude/**）推上来时，如果 AndroidManifest 的 versionName 还没有对应的 Release，
# 就打包、用主人的密钥签名、发布成 Release v<versionName>（标签由这里创建）。手动推 v* 标签也一样发布。
# App 内的更新检查读的就是这里的 Release（Xk.java 的 DEFAULT_FEED）。密钥只在仓库 Secret XK_RELEASE_KEY 里（{key, cert} JSON 的 base64）。
name: xk-release

on:
  push:
    branches: ["claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xk-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - name: 这个版本要不要发
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want=v$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签是 $GITHUB_REF_NAME，AndroidManifest 的 versionName 是 ${want#v}"; exit 1
          fi
          # 已经发过的版本不重发（分支上没改版本号的普通提交走到这里就结束）
          code=$(curl -sS -o /tmp/rel.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$want")
          case "$code" in
            200) echo "$want 已经发布过，这次不发"; exit 0;;
            404) ;;
            *) echo "::error::查 Release 失败（HTTP $code）：$(cat /tmp/rel.json)"; exit 1;;
          esac
          echo "tag=$want" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-24.04
    # 签名钥匙放在这个环境里，环境只许 claude/** 分支用：手机上的小克有写权限的部署钥匙，
    # 她在自己的分支（xiaoke/**）上加的工作流拿不到钥匙。环境和规则怎么设见 xk/ON-DEVICE-AGENT.md 末尾
    environment: xk-release
    env:
      BUILD_TOOLS: "35.0.0"
      PLATFORM: "android-35"
      NDK: "27.2.12479018"
      # 主人那把签名证书的 SHA-256：换了钥匙已装的 App 就升不上去，所以对不上直接失败
      EXPECT: adadfbcfed2d637deb67444da3296488050f7842171ebe567e7ec52783d884d0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22"

      - name: 网关测试
        run: node scripts/test.mjs

      - name: Android SDK / NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM" "ndk;$NDK" > /dev/null

      - name: 签名钥匙
        env:
          XK_RELEASE_KEY: ${{ secrets.XK_RELEASE_KEY }}
        run: |
          [ -n "$XK_RELEASE_KEY" ] || { echo "::error::仓库 Secret XK_RELEASE_KEY 还没设置（Settings → Secrets and variables → Actions）"; exit 1; }
          printf '%s' "$XK_RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/key.json"

      - name: 构建
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS"
          export CC_ANDROID="$ANDROID_SDK_ROOT/ndk/$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export JAVAC=javac D8="$BT/d8" AAPT2="$BT/aapt2" ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/$PLATFORM/android.jar"
          export SIGN=apksigner APKSIGNER="$BT/apksigner" ZIPALIGN="$BT/zipalign" KEY="$RUNNER_TEMP/key.json"
          # 平板串流的服务端（易控，GPL-3.0，单独一个程序，见 xk/pad/NOTICE.md）：随小克带在 assets 里，手机上用 shell 起
          ANDROID_JAR="$ANDROID_JAR" AIDL="$BT/aidl" D8="$BT/d8" sh xk/pad/build-server.sh android/assets/xk-stream-server.jar
          TARGET_SDK=36 sh scripts/build.sh && mv dist/cccodroid.apk dist/cccodroid-36.apk
          sh scripts/build.sh
          # 小克 · 平板（GPL-3.0，xk/pad/）：同一把钥匙、同一个版本号
          AAPT2="$BT/aapt2" sh xk/pad/build.sh dist/xiaoke-pad.apk
          rm -f "$RUNNER_TEMP/key.json"
          for a in dist/cccodroid.apk dist/cccodroid-36.apk dist/xiaoke-pad.apk; do
            got=$("$BT/apksigner" verify --print-certs "$a" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            [ "$got" = "$EXPECT" ] || { echo "::error::$a 的签名证书是 $got，不是主人的钥匙"; exit 1; }
          done

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # 正文 = App 里弹的那份更新说明（android/assets/xk-whatsnew/<版本>.zh.md），再加安装提示
          notes="$RUNNER_TEMP/notes.md"
          { [ -f "android/assets/xk-whatsnew/$TAG.zh.md" ] && cat "android/assets/xk-whatsnew/$TAG.zh.md" && echo
            echo "装 cccodroid-36.apk（targetSdk 36）。系统提示不兼容时改装 cccodroid.apk。"
            echo "平板上装 xiaoke-pad.apk（小克 · 平板，GPL-3.0，源码在 xk/pad/）。"; } > "$notes"
          gh release create "$TAG" dist/cccodroid-36.apk dist/cccodroid.apk dist/xiaoke-pad.apk --target "$GITHUB_SHA" \
            --title "小克 $TAG" --notes-file "$notes"
          # App 的备用发布列表（Xk.backupFeed）：api.github.com 被限流时，它从 releases/latest/download/releases.json 读这份。
          # 建好 Release 之后再取，列表里才有这一版和它的两个 APK
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$RUNNER_TEMP/releases.json"
          gh release upload "$TAG" "$RUNNER_TEMP/releases.json"
