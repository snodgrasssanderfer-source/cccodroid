# 小克的正式包：推一个 v* 版本标签（和 AndroidManifest 的 versionName 一致），就打包、用主人的密钥签名、发布成 Release。
# App 内的更新检查读的就是这里的 Release（Xk.java 的 DEFAULT_FEED）。密钥只在仓库 Secret XK_RELEASE_KEY 里（{key, cert} JSON 的 base64）。
name: xk-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      BUILD_TOOLS: "35.0.0"
      PLATFORM: "android-35"
      NDK: "27.2.12479018"
      # 主人那把签名证书的 SHA-256：换了钥匙已装的 App 就升不上去，所以对不上直接失败
      EXPECT: adadfbcfed2d637deb67444da3296488050f7842171ebe567e7ec52783d884d0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3   # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22"

      - name: 版本号对得上
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml | head -1)
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "::error::标签是 $GITHUB_REF_NAME，AndroidManifest 的 versionName 是 $want"; exit 1; }

      - name: 网关测试
        run: node scripts/test.mjs

      - name: Android SDK / NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM" "ndk;$NDK" > /dev/null

      - name: 签名钥匙
        env:
          XK_RELEASE_KEY: ${{ secrets.XK_RELEASE_KEY }}
        run: |
          [ -n "$XK_RELEASE_KEY" ] || { echo "::error::仓库 Secret XK_RELEASE_KEY 还没设置（Settings → Secrets and variables → Actions）"; exit 1; }
          printf '%s' "$XK_RELEASE_KEY" | base64 -d > "$RUNNER_TEMP/key.json"

      - name: 构建
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS"
          export CC_ANDROID="$ANDROID_SDK_ROOT/ndk/$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          export JAVAC=javac D8="$BT/d8" AAPT2="$BT/aapt2" ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/$PLATFORM/android.jar"
          export SIGN=apksigner APKSIGNER="$BT/apksigner" ZIPALIGN="$BT/zipalign" KEY="$RUNNER_TEMP/key.json"
          TARGET_SDK=36 sh scripts/build.sh && mv dist/cccodroid.apk dist/cccodroid-36.apk
          sh scripts/build.sh
          rm -f "$RUNNER_TEMP/key.json"
          for a in dist/cccodroid.apk dist/cccodroid-36.apk; do
            got=$("$BT/apksigner" verify --print-certs "$a" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            [ "$got" = "$EXPECT" ] || { echo "::error::$a 的签名证书是 $got，不是主人的钥匙"; exit 1; }
          done

      - name: 发布
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/cccodroid-36.apk dist/cccodroid.apk \
            --title "小克 $GITHUB_REF_NAME" --notes "装 cccodroid-36.apk（targetSdk 36）。系统提示不兼容时改装 cccodroid.apk。"

      - name: 手动跑时留个包
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: xiaoke-${{ github.sha }}
          path: dist/*.apk
          retention-days: 7
